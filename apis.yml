name: Terragia
description: Terragia is a cellulosic biofuel company developing technology to convert
  cellulosic biomass such as agricultural crop residues into ethanol and other low-carbon
  fuels at a cost competitive with petroleum. The company uses consolidated bioprocessing
  (CBP) with co-treatment, employing engineered thermophilic bacteria to reduce the
  capital expense and number of steps in bioprocessing, targeting difficult-to-electrify
  transportation sectors like aviation and maritime shipping. Founded on decades of
  research led by Dr. Lee Lynd and supported by the US Department of Energy's Center
  for Bioenergy Innovation, Terragia spun out of Enchi in 2022 and is based in Lebanon,
  New Hampshire. It is backed by General Catalyst. Terragia is a biotech and energy
  company and publishes no public developer, API, SDK, or webhook surface.
